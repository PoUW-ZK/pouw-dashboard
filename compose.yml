# Local development: Postgres with the indexer schema, the api views and fake data,
# and Hasura with the metadata of this repo. Not used for deployment (pouw-deploy).
# See README.md, "Run locally".
services:
  web:
    build: ./web
    depends_on:
      - hasura
    ports: [ "127.0.0.1:8080:8080" ]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pouw
      POSTGRES_PASSWORD: pouw
      POSTGRES_DB: pouw
    # 5433 on the host, so a Postgres already running on 5432 does not collide
    ports: [ "127.0.0.1:5433:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs the seeds in name order on the first start of a fresh volume, like CI
      - ./hasura/seeds/default:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # over TCP: during the first start the init server listens only on the socket,
      # so Hasura waits until the seeds are done
      test: [ "CMD", "pg_isready", "-U", "pouw", "-h", "127.0.0.1" ]
      interval: 5s
      retries: 10

  hasura:
    build: ./hasura
    depends_on:
      postgres: { condition: service_healthy }
    ports: [ "127.0.0.1:8081:8080" ] # hasura/config.yaml points the CLI at 8081
    environment:
      PG_DATABASE_URL: postgres://pouw:pouw@postgres:5432/pouw
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://pouw:pouw@postgres:5432/pouw
      HASURA_GRAPHQL_ADMIN_SECRET: dev # local only
      # console at http://localhost:8081/console, for browsing and trying queries.
      # Metadata changes belong in hasura/metadata/ (see README.md).
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true" # detailed errors, local only
      # Allow-list on, as in CI and on staging (pouw-dashboard#47): without the admin secret
      # only the operations of the contract run. HASURA_ALLOWLIST=false in .env turns it off
      # to try a query that is not in the contract yet. The console (admin) is never limited.
      HASURA_GRAPHQL_ENABLE_ALLOWLIST: ${HASURA_ALLOWLIST:-true}
      # Pages that may call Hasura from the browser directly: Vite dev server and CLI console.
      # The explorer itself goes through the /v1 proxy, so it is same-origin.
      HASURA_GRAPHQL_CORS_DOMAIN: http://localhost:5173, http://localhost:9695

  # Mock block source (pouw-dashboard#46): adds one fake block every few seconds, so the
  # explorer gets live data without a node. Only with: docker compose --profile mock up -d
  mock-blocks:
    image: postgres:16
    profiles: [ mock ]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: pouw
      PGPASSWORD: pouw
      PGDATABASE: pouw
      MOCK_BLOCK_INTERVAL: ${MOCK_BLOCK_INTERVAL:-5} # seconds between blocks
    volumes:
      - ./hasura/mock:/mock:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -q -f /mock/mock_blocks.sql
        while true; do
          echo "mock block $$(psql -At -c 'SELECT mock.add_block()')"
          sleep "$$MOCK_BLOCK_INTERVAL"
        done

volumes:
  pgdata:
